user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Report addresses carry a long random token (audit item B3), and the privacy
    # notice says the token is stripped before anything is written to the logs.
    # nginx logs the whole request line by default, so the line is rewritten
    # here: the log keeps the route, which is what it is read for, and loses the
    # address, which is a secret. The query string is dropped for the same
    # reason; campaign sources are counted in the app, not in this file.
    map $uri $uri_logged {
        default    $uri;
        ~^/r/       /r/[token];
    }

    # A report page sends no referrer at all, but a proxy or an older browser
    # that ignores the header must not be able to write one in either.
    map $http_referer $referer_logged {
        default    $http_referer;
        ~^(?<origin>https?://[^/]+)/r/    "${origin}/r/[token]";
    }

    log_format redacted '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri_logged $server_protocol" '
                        '$status $body_bytes_sent "$referer_logged" "$http_user_agent"';

    access_log /var/log/nginx/access.log redacted;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        client_max_body_size 5m;

        # Report addresses carry a token, and the access log above is rewritten
        # to hide it. The error log cannot be rewritten: nginx appends the raw
        # request line to an upstream failure, so a restart during a deploy
        # would write live tokens into error.log, which is the file that ends up
        # pasted into a support thread. Report requests therefore log no errors
        # of their own. An upstream outage is still visible on every other path,
        # which is where it should be read from anyway.
        location ^~ /r/ {
            error_log /dev/null crit;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # $remote_addr, not $proxy_add_x_forwarded_for. The appending form
            # keeps whatever the client sent and adds the real peer after it, and
            # the app reads the first entry, so a visitor could dictate the
            # address recorded against their own submission and could slip past
            # the rate limit on report link guessing by varying one header. This
            # form sends the single value nginx observed itself. If a CDN or a
            # load balancer is ever put in front of this, it must change again,
            # and the app must then read the entry naming the trusted hop.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name assessment.neogogy.ai;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name assessment.neogogy.ai;
        client_max_body_size 5m;

        ssl_certificate /etc/letsencrypt/live/assessment.neogogy.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/assessment.neogogy.ai/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # Report addresses carry a token, and the access log above is rewritten
        # to hide it. The error log cannot be rewritten: nginx appends the raw
        # request line to an upstream failure, so a restart during a deploy
        # would write live tokens into error.log, which is the file that ends up
        # pasted into a support thread. Report requests therefore log no errors
        # of their own. An upstream outage is still visible on every other path,
        # which is where it should be read from anyway.
        location ^~ /r/ {
            error_log /dev/null crit;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # $remote_addr, not $proxy_add_x_forwarded_for. The appending form
            # keeps whatever the client sent and adds the real peer after it, and
            # the app reads the first entry, so a visitor could dictate the
            # address recorded against their own submission and could slip past
            # the rate limit on report link guessing by varying one header. This
            # form sends the single value nginx observed itself. If a CDN or a
            # load balancer is ever put in front of this, it must change again,
            # and the app must then read the entry naming the trusted hop.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
